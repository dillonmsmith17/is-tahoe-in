<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Is Tahoe in? Yes or no for every Tahoe resort and touring zone, updated every 30 minutes.">
<title>Is Tahoe In?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,700;1,800;1,900&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: souvenir-shop board. One big oval bumper sticker up top; each spot is a rectangular bumper sticker, blue vinyl for YES. */
:root{
  --paper:#EEF3F8; --card:#FFFFFF; --vinyl:#FFFFFF; --ink:#0B2340; --muted:#5C6F86; --line:#D3DEEA;
  --tahoe:#0050B5; --tahoe-ink:#FFFFFF; --lake:#2B8FD6; --sky:#DCE9F7; --no:#8D99A8; --pine:#1D5C47; --warn:#A55A00;
  --shadow:0 1px 0 rgba(11,35,64,.06), 0 6px 16px -6px rgba(11,35,64,.25);
  --display:"Rubik", "Arial Black", "Helvetica Neue", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
  --d1:#50B848; --d2:#FFF200; --d3:#F7941E; --d4:#ED1C24; --d5:#231F20;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#061629; --card:#0C2340; --vinyl:#F4F8FC; --ink:#E6EEF7; --muted:#93A6BD; --line:#1A3658;
  --tahoe:#2F7BE6; --lake:#64B2F0; --sky:#14335A; --no:#6D7F95; --pine:#4FC79B; --warn:#F2B35C;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 18px -8px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#061629; --card:#0C2340; --vinyl:#F4F8FC; --ink:#E6EEF7; --muted:#93A6BD; --line:#1A3658;
  --tahoe:#2F7BE6; --lake:#64B2F0; --sky:#14335A; --no:#6D7F95; --pine:#4FC79B; --warn:#F2B35C;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 18px -8px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 56px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
a{color:var(--tahoe);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lake);outline-offset:3px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- The big sticker ---------- */
.hero{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-top:8px}
.bumper{width:min(100%,560px);aspect-ratio:2.05/1;border-radius:50%;background:var(--vinyl);display:grid;place-items:center;
  box-shadow:inset 0 0 0 clamp(6px,1.6vw,10px) var(--vinyl), inset 0 0 0 clamp(10px,2.6vw,16px) var(--tahoe), var(--shadow);
  transform:rotate(-2.5deg)}
.bumper h1{margin:0;font-family:var(--display);font-style:italic;font-weight:900;color:#0050B5;text-transform:uppercase;
  font-size:clamp(40px,10.5vw,82px);line-height:.88;letter-spacing:-.01em}
.bumper h1 small{display:block;font-size:.5em;font-weight:800;letter-spacing:.04em;color:#0050B5}
.tagline{font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tagline b{color:var(--tahoe);font-weight:900}
.tally{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 16px}
.tally .big{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(28px,6vw,40px);color:var(--ink);line-height:1}
.tally .big em{font-style:italic;color:var(--tahoe)}
.tally .when{font-size:13px;color:var(--muted)}
.notice{border:2px dashed var(--warn);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:13px;max-width:640px;text-align:left}
.notice summary{cursor:pointer}
.notice ul{margin:8px 0 0;padding-left:18px}

/* ---------- Controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--tahoe);background:transparent;color:var(--tahoe);border-radius:999px;padding:6px 18px;cursor:pointer;
  font-family:var(--display);font-style:italic;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--tahoe);color:var(--tahoe-ink)}

/* ---------- Regions ---------- */
.region{display:flex;flex-direction:column;gap:14px}
.region-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.region h2{margin:0;font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(24px,5vw,32px);text-transform:uppercase;letter-spacing:.01em;line-height:1}
.region .count{font-family:var(--display);font-style:italic;font-weight:800;font-size:14px;color:var(--tahoe);text-transform:uppercase;letter-spacing:.05em}
.wave{display:block;width:100%;height:10px;color:var(--lake)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media (max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:10px}}

/* ---------- Bumper-sticker tiles (rectangles) ---------- */
.tile{all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;padding:16px 16px 13px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;
  background:var(--card);box-shadow:inset 0 0 0 4px var(--card), inset 0 0 0 6px var(--line), var(--shadow)}
.tile.yes{background:#0050B5;color:#FFFFFF;box-shadow:inset 0 0 0 4px #0050B5, inset 0 0 0 6px #FFFFFF, 0 0 0 3px var(--vinyl), var(--shadow)}
.tile:focus-visible{outline:3px solid var(--lake);outline-offset:4px}
.tile .name{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15;min-height:2.3em;text-wrap:balance}
.tile .verdict{font-family:var(--display);font-style:italic;font-weight:900;font-size:64px;line-height:.9;letter-spacing:-.02em;color:var(--no)}
.tile.yes .verdict{color:#FFFFFF}
.tile .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px;margin-top:4px}
.tile.yes .meta{border-top-color:rgba(255,255,255,.35);color:rgba(255,255,255,.8)}
.fresh{white-space:nowrap}
.fresh b{font-family:var(--display);font-style:italic;font-weight:900;font-size:17px;color:var(--ink)}
.tile.yes .fresh b{color:#FFFFFF}
.tmr{white-space:nowrap;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.tmr b{font-family:var(--display);font-style:italic;font-weight:900;font-size:15px;letter-spacing:0;margin-left:2px}
.tmr b.y{color:var(--tahoe)} .tmr b.n{color:var(--no)}
.tile.yes .tmr b.y{color:#FFFFFF} .tile.yes .tmr b.n{color:rgba(255,255,255,.55)}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  .tile{transition:transform .18s ease}
  .tile:hover{transform:translateY(-3px) rotate(-.6deg)}
}

/* flags: one stamped label, serious things only */
.flags{display:flex;flex-wrap:wrap;gap:5px}
.flag{font-size:11px;font-weight:600;letter-spacing:.02em;border-radius:4px;padding:2px 7px;border:1.5px solid var(--line);color:var(--ink);background:var(--card);white-space:nowrap}
.flag.avy{border-color:var(--d3);color:var(--warn)}
.flag.road{border-color:var(--warn);color:var(--warn)}
.flag.wind{border-color:var(--lake);color:var(--lake)}
.flag.rain{border-color:var(--no);color:var(--muted)}
.tile.yes .flag{background:#FFFFFF;color:#8A4A00;border-color:#FFFFFF}

/* detail additions */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;font-size:14px}
.big-line{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;line-height:1.05;text-transform:uppercase;color:var(--ink)}
.big-line small{font-size:.6em;color:var(--muted)}
.chart.small svg{min-width:0;max-width:340px}
.rose{width:100%;max-width:220px;height:auto;justify-self:center}
.rainrow{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.rainrow b{color:var(--ink);font-family:var(--mono);font-weight:500}
.tmr-big{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.badge.mini{font-size:44px;border-radius:10px}
.routes{display:flex;flex-direction:column;gap:8px}
.route{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shield{font-family:var(--display);font-weight:800;font-size:13px;border:2px solid var(--ink);border-radius:6px;padding:1px 7px;min-width:64px;text-align:center}
.rs{font-weight:600}
.rs.ok{color:var(--pine)} .rs.warn{color:var(--warn)} .rs.bad{color:var(--d4)}
.alert{border:2px solid var(--d3);border-radius:10px;padding:10px 12px;font-weight:500}

/* big verdict sticker on detail pages */
.badge{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(72px,16vw,120px);line-height:1;padding:.12em .35em .14em;border-radius:14px;transform:rotate(-3deg)}
.badge.yes{background:#0050B5;color:#FFFFFF;box-shadow:inset 0 0 0 6px #0050B5, inset 0 0 0 9px #FFFFFF, 0 0 0 4px var(--vinyl), var(--shadow)}
.badge.no{background:#FFFFFF;color:#7E8B9A;box-shadow:inset 0 0 0 6px #FFFFFF, inset 0 0 0 9px #A9B4C0, 0 0 0 4px var(--vinyl), var(--shadow)}

/* avalanche mini scale */
.danger-mini{display:inline-flex;gap:3px}
.danger-mini i{width:9px;height:9px;transform:rotate(45deg);border:1px solid rgba(0,0,0,.35);display:block}

/* ---------- Detail ---------- */
.back{all:unset;cursor:pointer;color:var(--tahoe);font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.back:focus-visible{outline:3px solid var(--lake);outline-offset:3px}
.d-head{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center;justify-content:space-between}
.d-head h1{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(34px,7vw,58px);line-height:.95;margin:6px 0 4px;text-transform:uppercase;text-wrap:balance}
.d-head .sub{color:var(--muted);font-size:14px}
.qual{font-size:17px;max-width:60ch;font-weight:500}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--tahoe)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;line-height:1;color:var(--ink)}
.stat .v small{font-size:15px;color:var(--muted);font-weight:700}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:300px}
.surf-big{font-family:var(--display);font-style:italic;font-weight:900;font-size:32px;line-height:1;text-transform:uppercase;color:var(--tahoe)}
.foot{font-size:12px;color:var(--muted)}
.trace{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.trace li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:14px;align-items:start}
.trace .mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px}
.trace .ok{background:var(--tahoe);color:#fff}
.trace .bad{background:var(--line);color:var(--muted)}
.trace .note{background:var(--d3);color:#3a2000}
.trace small{display:block;color:var(--muted);font-size:12.5px}
.bands{display:flex;flex-direction:column;gap:8px}
.band{display:grid;grid-template-columns:118px 22px 1fr;gap:10px;align-items:center;font-size:14px}
.band i{width:16px;height:16px;transform:rotate(45deg);border:1px solid rgba(0,0,0,.4);display:block;margin-left:3px}
.problems{display:flex;flex-direction:column;gap:8px;font-size:14px}
.problems div{border-left:3px solid var(--d3);padding-left:10px}

footer{color:var(--muted);font-size:13px;text-align:center;max-width:62ch;margin:0 auto;display:flex;flex-direction:column;gap:6px;align-items:center}
footer .sig{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--tahoe);font-size:13px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="hero"><div class="bumper"><h1><small>Is Tahoe</small>In?</h1></div></div></div>
<script src="app.js"></script>
</body>
</html>
