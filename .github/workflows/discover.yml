name: Discover lift sources

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.js
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/
          retention-days: 3
