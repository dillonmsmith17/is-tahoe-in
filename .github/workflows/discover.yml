name: Discover lift sources

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.js
      - name: Push snapshots to a throwaway branch
        run: |
          cd snapshots
          git init -q -b snapshots
          git -c user.name=snapshot-bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=snapshot-bot -c user.email=bot@users.noreply.github.com commit -qm "Resort page snapshots $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" snapshots
